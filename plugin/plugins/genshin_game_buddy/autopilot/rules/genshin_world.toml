# ============================================================================
# 原神 · 大世界资源规则（2026-10-11 新增）
# ============================================================================
#
# 场景：WORLD（由 perception 的二值场景识别给出；UNKNOWN 也允许，
#       因为「画面里有个可交互物但场景判不准」时按一次 F 的代价极低）
#
# ★ priority 数字越小越优先（升序遍历，命中即停）。
#   间隔 10/20/30/40/50/60/70/80/90 刻意留空 —— 中间插新规则不用重排全表。
#
# ─────────────────────────────────────────────────────────────────────────
# ★★ 2026-10-11 真机实测后**重新关闭**（enabled = false）
# ─────────────────────────────────────────────────────────────────────────
#   曾经打开过（2026-10-11 上午），实测暴露两个问题，修完之前不许再开：
#
#   ❶ **规则每 tick 重发，F 键被按了 754 次**
#      run 20261011_180732，154.8 秒里754 条 INTENT_EXECUTED，
#      action 全是 USE_PICKUP —— 平均 **4.9 次/秒**，等于每 205ms 按一次 F。
#      直接原因：宝箱被打开后 ``has_nearby_chest()`` **没有变回 False**
#      （要么检测框没刷新，要么开的是「已开过」的箱子），规则于是
#      一直命中。**这是病根**：YUI 只说了 1 句，但游戏里按了 754 下。
#
#   ❷ **min_gap_ms=800 实测形同虚设**（详见 safety.py）
#      同一 run 只有 31 条 ``INTENT_REJECTED / MIN_GAP:USE_PICKUP``。
#      平均间隔 205ms 远小于 800ms，本该每一条都被拒 —— 实际没有。
#      说明这道闸门没有按预期生效，**在查清之前不能依赖它兜底**。
#
#   → 治本方向是 B2「已拾取标记」：USE_PICKUP 执行成功后给该实体打一个
#     短时标记（~2 秒内不再对同一实体触发），标记存 PolicyContext。
#     但**先修 ❷**：标记只是减压，闸门不灵的话标记也拦不住连发。
#
#   依赖的 context 函数：has_nearby_ore() has_nearby_chest() has_nearby_drops()
#                       has_nearby_enemy() hp() since() scene()
# ============================================================================

# ---------------------------------------------------------------------------
# 矿石 —— 采集（长按 F 出进度条，但键本身是同一个 F）
# ---------------------------------------------------------------------------
# ⚠ 真机核实点：``ore`` / ``unmined_ore`` 在模块文档记录的真机采样里
#   **检出数为 0**。分组登记了（``KIND_GROUPS``），但要确认是「模型压根
#   没这个类」还是「采样帧里正好没有矿」。跑
#   ``scripts/misc/bench_world_entities.py`` 可以定论。
#   若恒为 0，这条规则永远不会触发 —— 那是数据问题不是规则问题。

[[rules]]
name = "world_pickup_ore"
action = "USE_PICKUP"
when = "has_nearby_ore()"
priority = 30
ttl_seconds = 3
scenes = ["WORLD"]
enabled = false
note = "附近有矿 → 按 F 采集。⚠ 需先确认 ore 类真的能被检出"

# ---------------------------------------------------------------------------
# 宝箱 —— 开箱
# ---------------------------------------------------------------------------
# ⚠ 真机核实点：宝箱可能需要**长按** F（部分宝箱是长按交互），
#   而 USE_PICKUP 的 traits 是**点按**（holds_keys=False）。开不动就说明
#   需要给采集类动作单独一个长按变体，那是动作层的另一件事。
[[rules]]
name = "world_open_chest"
action = "USE_PICKUP"
when = "has_nearby_chest()"
priority = 20
ttl_seconds = 3
scenes = ["WORLD"]
enabled = false
note = "附近有宝箱 → 按 F 开。⚠ 部分宝箱需长按，当前是点按，实测后再定"

# ---------------------------------------------------------------------------
# 掉落物 —— 拾取（最该自动做的一条：摩拉/素材/好感物在地上不捡就白扔）
# ---------------------------------------------------------------------------
# 优先级放 40（比开箱低）：掉落物通常很多、单个价值低，不该抢在
# 「开宝箱」前面把唯一的一次 F 交互预算花掉。
[[rules]]
name = "world_pickup_drops"
action = "USE_PICKUP"
when = "has_nearby_drops()"
priority = 40
ttl_seconds = 2
scenes = ["WORLD"]
enabled = false
note = "附近有掉落物 → 按 F 捡。优先级刻意低于开箱"

# ---------------------------------------------------------------------------
# ⚠ 吃药 / 休息 —— **故意没写**，原因见下
# ---------------------------------------------------------------------------
# 原计划里应该有这两条：
#
#   world_heal_when_low : hp() < 0.35 and not has_nearby_enemy() → USE_FOOD
#   world_rest_when_resin_low : resin() < 20 → REST
#
# 两条都**查证后判定为不可靠**，按规矩不做，而不是做个指向不存在动作的
# 半成品（规则加载期就会因动作不在 ActionType 白名单而失败）：
#
#   * USE_FOOD（吃药）：原神 PC **没有食物快捷键**。使用食物必须
#     「B 打开背包 → 切食物页签 → 点具体食物 → Esc」，是依赖背包 UI 布局
#     的**复合操作**，而且要先决定「背包里哪一个食物」—— 那是物品选择
#     问题，不是键位问题。当前 ActionType 整个模型是「一个动作 = 一个键」。
#     要做必须先把动作层扩成「多步序列 + UI 元素定位」，另一个量级的工程。
#
#     顺带：战斗规则里现有的 `combat_heal_switch`（hp < 0.35 → 切角色）
#     就是当前的替代方案 —— 切人而不是吃药，靠奶妈拉血。
#
#   * REST（休息回体力）：**原神没有这个机制**。原粹树脂每 8 分钟自然恢复
#     1 点，且**不受是否在线影响**（关机也在后台累积）；只能额外用
#     脆弱树脂/须臾树脂（+60）或原石兑换补充。「食物、休息对恢复原粹树脂
#     毫无作用」。所以「等体力」的正确实现是 WAIT，不需要注入动作。
#
#   * hp() 本身也别信：v1 契约里血量/能量是**留空 = UNKNOWN** 的
#     （perception/builder.py 的 _player_info 注释明写「留空 = UNKNOWN，
#     决策层会保守跳过」）。真要用吃药，得先把血量接上。
