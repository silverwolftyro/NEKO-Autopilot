# ============================================================================
# 原神 · 战斗规则
# ============================================================================
#
# 场景：COMBAT（由 perception 的场景识别给出）
#
# ★ priority 数字越小越优先（升序遍历，命中即停）。
#   间隔 10/20/30/40/50/60/70/80/90 刻意留空 —— 中间插新规则不用重排全表。
#
# ⚠⚠ 已知限制：暂时用 scene() == 'COMBAT' 近似「有敌人」 ⚠⚠
#   StatePacket 里**没有** has_enemy 字段（第 1 期契约不含该信号）。
#   所以现在「识别成战斗场景」就当作「有敌人」，机器人会在进入战斗场景后
#   无条件开火 —— 包括队友满血、敌人已经跑远的情况。
#   等 YOLO 训出敌人检测后，把下面的 has_enemy() 占位规则取消注释启用，
#   并给所有战斗规则加上 has_enemy() 前置条件。详见 policy/context.py 的
#   PolicySignals 说明。
#
# 依赖的 context 函数：hp() energy() q_ready() e_ready() onfield()
#                       since() scene() pos_usable() perception_ok()
# ============================================================================

# ---------------------------------------------------------------------------
# 保命（最高优先级）—— 血量掉下去什么都白给
# ---------------------------------------------------------------------------

# 解决：战斗打完不点领取，奖励拿不到。
# 依赖：scene()
# ⚠ 这个场景根本不在"战斗"里，放 priority 10 只是因为它最该立刻处理。

[[rules]]
name = "world_attack_only_with_enemy"
action = "NORMAL_ATTACK"
when = "has_nearby_enemy()"
priority = 85
ttl_seconds = 2
scenes = ["WORLD"]
enabled = true
note = "看见敌人标识才长按普攻"

# 低血 + 有敌人 -> 闪避。§30 给 DODGE 的 allowed_scenes 加了 WORLD，
# 不然这条规则在二值场景下过不了 traits 的场景校验。
# 依赖：has_nearby_enemy() hp()

# --------------------------------------------------------------------------
# 进场先等一拍（2026-10-11 从 _future 挪回）
# --------------------------------------------------------------------------
# ★ 之前被误判为死规则：当时用合成的 StatePacket 探测 DSL，
#   那个夹具没带 scene.entered_ms，于是 since() 恒 UNKNOWN。
#   但 builder.py:592 **一直**在设 entered_ms（_track_scene_enter），
#   所以 since() 在生产里是真值。这条从来都能跑。
[[rules]]
name = "combat_settle_on_enter"
action = "WAIT"
when = "since() < 500"
priority = 60
ttl_seconds = 1
scenes = ["COMBAT"]
params = { ms = 500 }
enabled = false
note = "进场景先等 0.5s 稳定"

# ---------------------------------------------------------------------------
# 兜底（最低优先级）
# ---------------------------------------------------------------------------
#
# ⚠️ 2026-10-03 **删除了 combat_normal_attack_default**（原 priority 90）。
#
# ⚠️ 但要说清楚：删它**不是安全操作，是清理死代码**。原规则
#    ``when = "scene() == 'COMBAT'"`` + ``scenes = ["COMBAT"]``
#    + ``enabled = false`` —— **三条各自独立的原因让它本来就不会触发**：
#      1. ``enabled = false``
#      2. ``scenes = ["COMBAT"]``，而 §28 之后场景是二值的，永不产出 COMBAT
#    所以它从来没抢过风，也不存在"删了才安全"这回事。
#
#    真正取代它的是下面 §29 的 ``world_attack_only_with_enemy``
#    （priority 85、scenes=["WORLD"]、enabled=true、依赖 has_nearby_enemy()）。
#    两者不是同一件事：兜底规则是"是战斗场景就打"，新规则是
#    **"看见敌人标识才打"** —— 后者才是我们要的语义。

# ============================================================================
# 以下是 has_enemy() 的占位规则 —— 感知层产出该信号后取消注释启用
# ============================================================================
#
# ⚠️ **这些占位规则已被 §29 的同名能力取代，别再用它们。**
#    它们依赖 ``has_enemy()``（PolicySignals 里**手动声明**的信号，
#    默认 None -> UNKNOWN），而 §29 用的是 ``has_nearby_enemy()``
#    （bgi_world **实际检出**）。两个名字很像、来源不同 —— 见
#    policy/context.py 的注释。

# 占位：退出战斗结算界面（需要「奖励已领取」的 OCR 判定，当前不可用）
# [[rules]]
# name = "combat_result_close_after_claim"
# action = "CLOSE"
# when = "false"
# priority = 25
# ttl_seconds = 2
# scenes = ["COMBAT_RESULT"]

# ============================================================================
# §29 · 二值场景下的战斗规则（依赖世界实体检测）
# ============================================================================
#
# ★ 为什么这一段以前写不了
#   上面那些 `has_enemy()` 占位规则的注释说"StatePacket 当前没有该信号" ——
#   确实没有。§22 接入 bgi_world 之后有了，但走的是**侧信道**
#   （builder.last_world_entities -> PolicyContext.world_entities，
#   不进 StatePacket），所以规则里要调的是
#
#       has_nearby_enemy()     ← 检测器实际看见了 enemy_identify
#   而不是
#       has_enemy()            ← PolicySignals 里**手动声明**的信号
#
#   两个名字很像但来源完全不同，别混用（详见 policy/context.py 的注释）。
#
# ★ 场景写成 WORLD 而不是 COMBAT
#   §28 之后场景判定是二值的（SceneDetector -> WORLD / UNKNOWN），
#   **永不产出 COMBAT**。所以 rules 的 `scenes` 必须写 WORLD，
#   否则这条规则永远不会被评估。
#
# ★ enabled = true（2026-10-03 启用）
#   实体检测已在真机验证通过：WORLD 场景下正常触发，检到过世界实体。
#
# ⚠️ **但真机验证检出的是「紫色电气水晶」(unmined_ore / drops)，
#    不是 enemy_identify。** 所以那一次验证里
#    ``has_nearby_enemy()`` 其实是 **False**，这三条规则**一次都不会触发**。
#    它们是"接好了、等真出现敌人时才开火"，不是"已经在开火了"。
#    要确认它真的会开火，需要一次**真的有敌人标识**的实测。

# 有敌人标识才普攻
# 依赖：has_nearby_enemy()
