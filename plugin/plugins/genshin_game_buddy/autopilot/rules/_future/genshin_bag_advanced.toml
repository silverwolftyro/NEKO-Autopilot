# ============================================================================
# 原神 · 背包 / 资源管理（2026-10-11 新增）
# ============================================================================
#
# 这个方向**今天一条都写不出来**，理由比战斗方向更硬：
#
#   场景识别是**二值**的（WORLD / UNKNOWN），从不产出 BAG_INVENTORY。
#     所以老的 6 条 bag_* 规则全部**场景永不匹配** ——
#     scene() == 'BAG_INVENTORY' 是个恒假判断。
#
#   resin() 返回 PlayerInfo.resin，而它**未观测**（v1 不做几何投影）。
#     resin() >= 160 恒 UNKNOWN。
#
#   背包内的物品清单、圣遗物数量、武器数量、材料类别 ——
#     **感知层一个都没有**，连 UnknownValue 的载体都不存在。
#
# 所以本文件**只有一条规则**，而且它今天同样是死的：
# 它依赖的 scene() == 'BAG_INVENTORY' 和 since() 两个条件都不成立。
# 保留它是因为等场景识别扩到多值之后，它是这个方向第一条该有的规则 ——
# 写在文件里比等���再回忆一遍要好。
#
# ⚠️ note 一律用 TOML **字面量**字符串（'''）而不是基本字符串（"""）：
#    基本字符串会解释反斜杠转义，而我们希望 note 原样保留。
#
# 依赖的 context 函数：scene() since() perception_ok()
# ============================================================================

[[rules]]
name = "bag_watchdog_close_when_idle"
action = "CLOSE"
when = "scene() == 'BAG_INVENTORY' and since() > 60000"
priority = 90
ttl_seconds = 2
scenes = ["BAG_INVENTORY"]
enabled = false
note = '''
看门狗：背包开着超过 60 秒（疑似 UI 识别卡住）就强制关掉。

⚠ 这条今天**永不触发**，两个条件都不成立：
  1) scene() 只会是 WORLD / UNKNOWN，永不是 BAG_INVENTORY
  2) since() 恒 UNKNOWN（scene.entered_ms 未设置）
  保留它的理由：等场景识别扩到多值 + since() 接通之后，它是第一条该有的规则。

—— 为什么这个方向一条规则都写不出来（完整清单）——
  树脂满了去合成   ✗ resin() 未观测
  圣遗物满了清理   ✗ 背包清单感知不存在
  武器满了升级     ✗ 同上
  材料满了转换     ✗ 同上
  吃药            ✗ hp() 未观测 + 原神无食物快捷键（ActionType 也不该加）

解锁顺序：
  ① 场景识别扩到多值（BAG_INVENTORY / MAP_BIG / COMBAT …）
  ② 感知层加背包清单读取（需要 OCR 或内存读取，两者都还没做）
  ③ 接 resin / hp / energy 的几何投影观测
在那之前，这个方向上任何规则都是装饰。'''